version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protein-villa-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=protein-villa-super-secret-jwt-token-2026-secure
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/prisma
    networks:
      - protein-villa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protein-villa-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - protein-villa-network

networks:
  protein-villa-network:
    driver: bridge

volumes:
  backend-data:
