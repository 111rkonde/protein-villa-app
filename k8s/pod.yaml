# Standalone Backend Pod definition (for debugging / verification)
apiVersion: v1
kind: Pod
metadata:
  name: protein-villa-backend-standalone-pod
  namespace: protein-villa
  labels:
    app: protein-villa-backend-debug
spec:
  restartPolicy: OnFailure
  containers:
    - name: backend-debug
      image: protein-villa-backend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
      envFrom:
        - configMapRef:
            name: protein-villa-config
        - secretRef:
            name: protein-villa-secrets
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
---
# Standalone Frontend Pod definition (for debugging / verification)
apiVersion: v1
kind: Pod
metadata:
  name: protein-villa-frontend-standalone-pod
  namespace: protein-villa
  labels:
    app: protein-villa-frontend-debug
spec:
  restartPolicy: OnFailure
  containers:
    - name: frontend-debug
      image: protein-villa-frontend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "25m"
        limits:
          memory: "256Mi"
          cpu: "250m"
