apiVersion: apps/v1
kind: Deployment
metadata:
  name: protein-villa-backend
  namespace: protein-villa
  labels:
    app: protein-villa-backend
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: protein-villa-backend
  template:
    metadata:
      labels:
        app: protein-villa-backend
        tier: api
    spec:
      containers:
        - name: backend
          image: protein-villa-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: protein-villa-config
            - secretRef:
                name: protein-villa-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: db-storage
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: protein-villa-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: protein-villa
  labels:
    app: protein-villa-backend
spec:
  type: ClusterIP
  selector:
    app: protein-villa-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
