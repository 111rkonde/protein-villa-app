apiVersion: apps/v1
kind: Deployment
metadata:
  name: protein-villa-frontend
  namespace: protein-villa
  labels:
    app: protein-villa-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: protein-villa-frontend
  template:
    metadata:
      labels:
        app: protein-villa-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: protein-villa-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: protein-villa
  labels:
    app: protein-villa-frontend
spec:
  type: ClusterIP
  selector:
    app: protein-villa-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
