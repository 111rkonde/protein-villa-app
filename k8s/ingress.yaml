apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protein-villa-ingress
  namespace: protein-villa
  labels:
    app: protein-villa
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # If using cert-manager for automatic Let's Encrypt SSL:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # If using AWS ACM with AWS Load Balancer Controller:
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_UUID
spec:
  tls:
    - hosts:
        - devopswithyogesh.online
        - www.devopswithyogesh.online
      secretName: devopswithyogesh-tls-secret
  rules:
    # Rule for Apex Domain (devopswithyogesh.online)
    - host: devopswithyogesh.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # Rule for Subdomain (www.devopswithyogesh.online)
    - host: www.devopswithyogesh.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
